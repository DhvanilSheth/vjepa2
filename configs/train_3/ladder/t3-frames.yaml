# GENERATED by scripts/make_ladder_configs.py from
# configs/train_3/proxy/base-1gpu.yaml -- do not edit this file.
#
# ARM t3-frames: Mask 0 hides 6 of 8 whole time-steps instead of spatial blocks.
# Changes vs the base file: mask.0.hide_time_steps: 6
# Encoder can be loaded from a V-JEPA 2.1 checkpoint: yes (only the w-arms actually do; every other arm trains from scratch)
#
# Everything below this line is the base file with only those keys (and
# `folder`) rewritten; the comments are the base file's own.
#
# V-JEPA 3 -- single-GPU proxy recipe.  This is the BASE of the ablation ladder
# (configs/train_3/ladder/*.yaml are generated from it by
# scripts/make_ladder_configs.py -- edit this file or that script's ARMS table,
# never the generated files).
#
#   python -m app.main --fname configs/train_3/proxy/base-1gpu.yaml --devices cuda:0
#
# WHAT A PROXY RUN IS FOR
#   Ranking components against each other cheaply on one GPU.  It is not the
#   paper recipe and its absolute numbers will not match the paper's.
#
# HOW IT DIFFERS FROM configs/train_3/vitb16/pretrain-256px-16f.yaml
#   * one rank (nodes: 1, tasks_per_node: 1) instead of 64;
#   * VIDEO ONLY: no img_data / img_mask.  V-JEPA trains images and video on
#     disjoint ranks, so joint training needs >= 2 GPUs (train.py raises a
#     clear error otherwise);
#   * one dataset instead of three;
#   * the isotropy diagnostic is switched on (measurement only);
#   * the settings tagged SCREEN below.
#
# SCREEN: values set for a short exploratory ("screening") run on one Quadro
# RTX 8000 (48 GB), from measurements on that card (Nov 2026):
#   * dtype float16: that card runs bfloat16 ~9x slower than float16
#     (7.6 s vs 1.7 s per step here).  On an Ampere-or-newer card use bfloat16.
#   * use_activation_checkpointing false: checkpointing recomputes a forward
#     pass to save memory; this recipe peaks at 7.8 GB with it on, so the
#     memory is not needed.  Same gradients either way.
#   * epochs 30 x ipe 300 = 9,000 iterations (upstream's config runs 300,000;
#     the paper reports 135,000 + 12,000).
#     Short on purpose: it ranks arms, it does not produce a final model.
#     Confirm any winner with a longer run.
#   * lambda_warmup_frac [0.05, 0.1]: the context-loss warm-up at the same
#     FRACTION of the run as upstream's config.  Without it V-JEPA 2.1's fixed
#     15,000 -> 30,000 iterations would leave the context loss off for this
#     entire run.
#   * lr 2e-4: NOT tuned.  Upstream's config uses 6e-4 (the paper reports
#     5.25e-4) for a total batch of 3,072;
#     2e-4 is the highest value a test run at batch 16 was observed stable at.
# Whatever you change, keep it IDENTICAL across arms.
app: vjepa_3
nodes: 1
tasks_per_node: 1
cpus_per_task: 8
mem_per_gpu: 48G
folder: /your_folder/pretrain_3/ladder/t3-frames
data:
  dataset_type: VideoDataset
  datasets:
  - /your_data/ssv2_train_paths.csv
  datasets_weights:
  - 1.0
  batch_size: 16          # SCREEN (GPU is compute-bound; a larger batch is not faster)
  crop_size: 256
  patch_size: 16
  dataset_fpcs:
  - 16
  tubelet_size: 2
  fps: 4
  num_workers: 24         # SCREEN (8 left the GPU waiting on video decode)
  # false ON PURPOSE.  V-JEPA 2.1's train.py never read this key, so the
  # eight ladder runs of Nov 2026 all respawned their workers at every data
  # refill whatever this line said.  train.py reads it now; kept-alive
  # workers save about 35 minutes a run but draw a different augmentation
  # and mask stream, so keep false for any arm compared with those runs.
  persistent_workers: false
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
loss:
  # -- V-JEPA 3: optional regulariser on the context encoder's output tokens
  #    (app/vjepa_3/regularizers.py), ADDED to the loss; the EMA teacher
  #    stays.  reg_type: null | sigreg | visreg.  null => V-JEPA 2.1's loss.
  #    reg_weight multiplies the term (must be > 0 when reg_type is set).
  #    reg_num_slices: random 1-D projections per step.  reg_max_tokens:
  #    tokens sampled per step.  The two parts of the loss are logged apart
  #    in <folder>/reg_r0.csv.
  reg_type: null
  reg_weight: 0.0
  reg_num_slices: 1024
  reg_max_tokens: 4096
  loss_exp: 1.0
  predict_all: true
  reg_coeff: 0.0
  shift_by_n: 0
  weight_distance_loss: true
# -- V-JEPA 3: two optional keys on each `mask:` entry (app/vjepa_3/masks.py).
#    Both defaults give V-JEPA 2.1's masks, from 2.1's own code.
#    hide_time_steps: 0 = spatial blocks hidden in every frame (2.1).  k > 0 =
#      for this mask, hide k whole time-steps instead and predict them from
#      the visible ones (one time-step is tubelet_size frames).
#    truncation: tail = cut each batch's token lists to the shortest one from
#      the END (2.1; leaves the end of every clip largely unused).  random =
#      keep a random subset of the same size, so the whole clip is used.
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  hide_time_steps: 6
  truncation: tail
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  hide_time_steps: 0
  truncation: tail
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  # -- V-JEPA 3: start the ENCODER from a released V-JEPA 2.1 file (see
  #    app/vjepa_3/pretrained.py); the predictor still starts untrained.
  #    null => from scratch.  Key: ema_encoder for the released ViT-B / ViT-L,
  #    target_encoder for ViT-g / ViT-G and for this repo's own checkpoints.
  pretrained_encoder: null
  pretrained_encoder_key: ema_encoder
  dtype: float16          # SCREEN
  load_checkpoint: true
  read_checkpoint: null
  save_every_freq: 10     # SCREEN (epochs 10/20/30 are kept, to check a ranking is stable)
  seed: 239
  use_sdpa: true
  # Isotropy reading every 100 iterations -> <folder>/diag_r0.csv.
  # Measurement only; identical in every arm.
  sigreg_diag_freq: 100
model:
  has_cls_first: false
  # Kept at 1 although this run is video-only: it keeps the image patch
  # embedding and modality embeddings in the model, so the checkpoint has
  # the same keys as the joint image+video recipe and can be carried over
  # when scaling up.  Those parameters simply receive no gradient here.
  img_temporal_dim_size: 1
  interpolate_rope: true
  # -- V-JEPA 3: RoPE frequency control.  Both defaults reproduce V-JEPA 2.1
  #    exactly (an axis left at 10000.0 takes the byte-identical legacy path).
  #    rope_theta: RoPE base / "max wavelength".  Scalar, or [d, h, w] where
  #      h and w MUST match (spatial isotropy; unequal bases give the model a
  #      preferred image axis and raise ValueError).  At 8 temporal positions
  #      only 4 of 10 rotary channels sweep >0.2 rad with base 10000; base 100
  #      raises that to 8.  Ablation arms: 10000 (control), 1000, 100,
  #      [100, 10000, 10000] (temporal-only rebase).
  #    rope_temporal_scale: VideoRoPE "adjustable temporal spacing" -- scales
  #      the temporal index.  <1.0 compresses; useful when moving 16f -> 64f.
  rope_theta: 10000.0
  rope_temporal_scale: 1.0
  # -- V-JEPA 3: Cayley-STRING (models/utils/string.py).  Defaults off, and
  #    string_init_std: 0.0 makes P = I exactly, so enabling use_string on a
  #    warm start from a V-JEPA 2.1 checkpoint begins at the 2.1 solution.
  #    use_string / use_string_predictor are separate because the predictor's
  #    RoPE never sees T/H/W and runs on re-sorted tokens -- a different
  #    positional regime, worth ablating on its own.
  use_string: false
  use_string_predictor: false
  string_share_across_layers: false
  string_init_std: 0.0
  # -- V-JEPA 3: feed-forward variant (models/utils/ffn.py).  null keeps the
  #    V-JEPA 2.1 behaviour: a GELU MLP, or SwiGLU if use_silu / use_pred_silu.
  #    Options: gelu | relu2 | swiglu | geglu | reglu.  ffn_type is the
  #    encoder, pred_ffn_type the predictor.  Changing either means training
  #    from scratch: a 2.1 checkpoint cannot warm-start a different FFN.
  ffn_type: null
  pred_ffn_type: null
  # -- V-JEPA 3: normalization-free variants (models/utils/norms.py).  null
  #    keeps LayerNorm.  Options: layernorm | dyt | derf.  norm_type replaces
  #    the two pre-norms in every block of BOTH encoder and predictor;
  #    norm_out_type replaces the output norms (encoder deep-supervision
  #    norms, predictor_norm) and follows norm_type when null.  Also
  #    from-scratch only.
  norm_type: null
  norm_out_type: null
  is_causal: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  modality_embedding: true
  model_name: vit_base
  n_registers: 0
  n_registers_predictor: 0
  normalize_predictor: false
  pred_depth: 12
  pred_embed_dim: 384
  pred_is_causal: false
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: false   # SCREEN
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  # -- V-JEPA 3 (defaults = V-JEPA 2.1 behaviour):
  #    clip_grad: max global gradient norm; null = no clipping.
  #    freeze_encoder_iters: the encoder takes no optimizer step for this many
  #      iterations (lets an untrained predictor catch up on a warm start).
  #    encoder_lr_scale: encoder learning rate as a multiple of the schedule.
  clip_grad: null
  freeze_encoder_iters: 0
  encoder_lr_scale: 1.0
  ema:
  - 0.99925
  - 0.99925
  epochs: 30              # SCREEN
  final_lr: 0.0002        # SCREEN
  final_weight_decay: 0.04
  ipe: 300
  ipe_scale: 1.25
  lambda_warmup_frac:     # SCREEN
  - 0.05
  - 0.1
  lr: 0.0002              # SCREEN
  start_lr: 0.0001
  warmup: 3               # SCREEN (10% of the run; upstream's config uses 4%)
  weight_decay: 0.04
