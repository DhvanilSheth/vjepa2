app: vjepa_3
nodes: 16
tasks_per_node: 8
cpus_per_task: 16
mem_per_gpu: 220G
folder: /your_folder/cooldown_3/16.8.vitb.256px.16f
data:
  dataset_type: VideoDataset
  datasets:
  - /your_data/k710_train_paths.csv
  - /your_data/ssv2_train_paths.csv
  - /your_data/howto_320p.csv
  datasets_weights:
  - 0.335
  - 0.100
  - 0.565
  batch_size: 24
  crop_size: 256
  dataset_fpcs:
  - 64
  - 64
  - 64
  fps: 4
  num_workers: 12
  patch_size: 16
  persistent_workers: true
  pin_mem: false
  tubelet_size: 2
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0

img_data:
  batch_size: 144
  crop_size: 256
  dataset_fpcs:
  - 1
  dataset_type: VideoDataset
  datasets:
  - /your_data/imagenet1k.csv
  datasets_weights:
  - 1.0
  rank_ratio: 0.5
img_mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 10
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0

loss:
  # -- V-JEPA 3: optional regulariser (app/vjepa_3/regularizers.py).
  #    reg_type: null | sigreg | visreg.  null => V-JEPA 2.1's loss.
  reg_type: null
  reg_weight: 0.0
  reg_num_slices: 1024
  reg_max_tokens: 4096
  computing_gram_loss: false
  gram_HighRes: false
  gram_ckpt: None
  gram_loss_weight: 10.0
  loss_exp: 1.0
  predict_all: true
  shift_by_n: 0
  weight_distance_loss: false
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  # -- V-JEPA 3: encoder warm start (app/vjepa_3/pretrained.py).  null => off.
  pretrained_encoder: null
  pretrained_encoder_key: ema_encoder
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: null
  save_every_freq: 50
  seed: 239
  use_sdpa: true
  # -- V-JEPA 3: every N iterations, log how close the target-encoder features
  #    are to an isotropic Gaussian (app/vjepa_3/diagnostics.py) to
  #    <folder>/diag_r0.csv.  Measurement only; 0 = off.
  sigreg_diag_freq: 0
model:
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  # -- V-JEPA 3: RoPE frequency control.  Both defaults reproduce V-JEPA 2.1
  #    exactly (an axis left at 10000.0 takes the byte-identical legacy path).
  #    rope_theta: RoPE base / "max wavelength".  Scalar, or [d, h, w] where
  #      h and w MUST match (spatial isotropy; unequal bases give the model a
  #      preferred image axis and raise ValueError).  At 8 temporal positions
  #      only 4 of 10 rotary channels sweep >0.2 rad with base 10000; base 100
  #      raises that to 8.  Ablation arms: 10000 (control), 1000, 100,
  #      [100, 10000, 10000] (temporal-only rebase).
  #    rope_temporal_scale: VideoRoPE "adjustable temporal spacing" -- scales
  #      the temporal index.  <1.0 compresses; useful when moving 16f -> 64f.
  rope_theta: 10000.0
  rope_temporal_scale: 1.0
  # -- V-JEPA 3: Cayley-STRING (models/utils/string.py).  Defaults off, and
  #    string_init_std: 0.0 makes P = I exactly, so enabling use_string on a
  #    warm start from a V-JEPA 2.1 checkpoint begins at the 2.1 solution.
  #    use_string / use_string_predictor are separate because the predictor's
  #    RoPE never sees T/H/W and runs on re-sorted tokens -- a different
  #    positional regime, worth ablating on its own.
  use_string: false
  use_string_predictor: false
  string_share_across_layers: false
  string_init_std: 0.0
  # -- V-JEPA 3: feed-forward variant (models/utils/ffn.py).  null keeps the
  #    V-JEPA 2.1 behaviour: a GELU MLP, or SwiGLU if use_silu / use_pred_silu.
  #    Options: gelu | relu2 | swiglu | geglu | reglu.  ffn_type is the
  #    encoder, pred_ffn_type the predictor.  Changing either means training
  #    from scratch: a 2.1 checkpoint cannot warm-start a different FFN.
  ffn_type: null
  pred_ffn_type: null
  # -- V-JEPA 3: normalization-free variants (models/utils/norms.py).  null
  #    keeps LayerNorm.  Options: layernorm | dyt | derf.  norm_type replaces
  #    the two pre-norms in every block of BOTH encoder and predictor;
  #    norm_out_type replaces the output norms (encoder deep-supervision
  #    norms, predictor_norm) and follows norm_type when null.  Also
  #    from-scratch only.
  norm_type: null
  norm_out_type: null
  lambda_progressive: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  modality_embedding: true
  model_name: vit_base
  n_registers: 0
  normalize_predictor: false
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  # -- V-JEPA 3 (defaults = V-JEPA 2.1 behaviour); see train.py.
  clip_grad: null
  freeze_encoder_iters: 0
  encoder_lr_scale: 1.0
  anneal_ckpt: /your_folder/pretrain_2_1/16.8.vitb.256px.16f/latest.pth.tar
  ema:
  - 0.99925
  - 0.99925
  epochs: 40
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: 300
  ipe_scale: 1.25
  is_anneal: true
  lr: 0.0006
  resume_anneal: true
  start_lr: 0.0001
  warmup: 0
  weight_decay: 0.04
